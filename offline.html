<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scan the Ditto Offline</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  background:#111;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.app{max-width:520px;margin:auto}
.logo{text-align:center;font-size:52px;margin-top:15px}
h1{text-align:center;margin:5px 0;font-size:30px}
.subtitle{text-align:center;color:#aaa;margin-bottom:25px}

.box,.lookup,.card{
  background:#1e1e1e;
  border:1px solid #333;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}

.label{
  color:#aaa;
  font-size:12px;
  letter-spacing:1px;
  margin-bottom:7px;
}

.value{font-size:20px;font-weight:800}
.online{color:#72e59a}
.offline{color:#ffcf66}

button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:18px;
  margin:8px 0;
  font-size:18px;
  font-weight:900;
}

.scan{background:#ff66b3;color:#111}
.sync{background:#7dd3fc;color:#111}
.lookupButton{background:#333;color:#fff}

input{
  width:100%;
  padding:16px;
  background:#111;
  color:#fff;
  border:1px solid #555;
  border-radius:12px;
  font-size:18px;
  text-transform:uppercase;
}

.lookup{margin-top:20px}
.card{display:none;margin-top:20px}

.cardTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.id{
  background:#ff66b3;
  color:#111;
  padding:7px 12px;
  border-radius:999px;
  font-weight:900;
}

.status{
  color:#7dd3fc;
  font-size:13px;
  font-weight:900;
}

.card h2{
  font-size:28px;
  margin:18px 0 5px;
}

.identity{font-weight:700}
.meta{color:#bbb;margin-top:5px}

.physical{
  margin-top:18px;
  background:#111;
  padding:15px;
  border-radius:12px;
}

.price{
  margin-top:15px;
  background:#ff66b3;
  color:#111;
  padding:18px;
  border-radius:14px;
}

.price strong{
  display:block;
  font-size:30px;
}

.marketTitle{
  margin-top:20px;
  color:#7dd3fc;
  font-size:12px;
  font-weight:900;
}

.market{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:8px;
}

.market div{
  background:#111;
  padding:12px 8px;
  border-radius:12px;
}

.market span{
  display:block;
  color:#7dd3fc;
  font-size:10px;
  font-weight:900;
}

.market strong{
  display:block;
  margin-top:5px;
}

.footer{
  text-align:center;
  color:#777;
  font-size:12px;
  margin:28px 0;
}

@media(max-width:420px){
  body{padding:12px}
  .market{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">🔴</div>
  <h1>SCAN THE DITTO</h1>
  <div class="subtitle">Offline Card Lookup</div>

  <div class="box">
    <div class="label">CONNECTION</div>
    <div id="connection" class="value">Checking...</div>
  </div>

  <div class="box">
    <div class="label">OFFLINE INVENTORY</div>
    <div id="inventory" class="value">No inventory synced yet</div>
  </div>

  <button class="scan" onclick="scanCard()">📷 SCAN CARD</button>

  <button id="syncButton" class="sync" onclick="syncInventory()">
    ↻ SYNC INVENTORY
  </button>

  <div class="lookup">
    <div class="label">MANUAL DITTO ID</div>

    <input
      id="dittoId"
      placeholder="D00001"
      autocomplete="off"
    >

    <button class="lookupButton" onclick="lookupCard()">
      LOOK UP CARD
    </button>
  </div>

  <div id="card" class="card"></div>

  <div class="footer">
    Chasing Ditto<br>
    Market sources inform the price. Ditto sets the price.
  </div>

</div>

<script>
const SYNC_URL =
"https://script.google.com/macros/s/AKfycbyNRAIqNR_Hnupku-BTr-E272OcC-w45qRACcvUjDVha72KxZGU9aD4hqWc38QNuSwsFA/exec";


function updateConnection(){
  const el=document.getElementById("connection");

  if(navigator.onLine){
    el.textContent="ONLINE";
    el.className="value online";
  }else{
    el.textContent="OFFLINE — DITTO STILL LIVES";
    el.className="value offline";
  }
}


function updateInventory(){
  const raw=localStorage.getItem("dittoInventory");
  const last=localStorage.getItem("dittoLastSync");
  const el=document.getElementById("inventory");

  if(!raw){
    el.textContent="No inventory synced yet";
    return;
  }

  try{
    const cards=JSON.parse(raw);
    const count=Object.keys(cards).length;

    el.textContent=count+" cards stored on this device";

    if(last){
      el.textContent+=" • "+new Date(last).toLocaleString();
    }
  }catch(err){
    el.textContent="Inventory needs to be synced again";
  }
}


function normalizeId(value){
  let id=String(value||"").trim().toUpperCase();

  const match=id.match(/[?&]id=(D?\d+)/i);
  if(match) id=match[1];

  id=id.replace(/^D/,"");

  if(!/^\d+$/.test(id)) return "";

  return "D"+id.padStart(5,"0");
}


function money(value){
  const n=Number(value);

  if(!value || !isFinite(n) || n<=0) return "—";

  return "$"+n.toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}


function esc(value){
  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function showCard(card){
  const el=document.getElementById("card");

  const physical=
    String(card.itemType||"").toLowerCase()==="graded"
      ? [card.grader,card.grade].filter(Boolean).join(" ") || "Graded"
      : "Raw";

  const identity=
    [card.set,card.number].filter(Boolean).join(" · ");

  const meta=
    [card.game,card.language,card.variant].filter(Boolean).join(" · ");

  el.innerHTML=`
    <div class="cardTop">
      <div class="id">${esc(card.id)}</div>
      <div class="status">${esc(card.status||"ACTIVE")}</div>
    </div>

    <h2>${esc(card.name)}</h2>

    <div class="identity">${esc(identity)}</div>
    <div class="meta">${esc(meta)}</div>

    <div class="physical">
      <div class="label">PHYSICAL CARD</div>
      <strong>${esc(physical)}</strong>
      ${
        card.condition
        ? `<div class="meta">Condition: <b>${esc(card.condition)}</b></div>`
        : ""
      }
    </div>

    <div class="price">
      <div class="label" style="color:#111">DITTO PRICE</div>
      <strong>${card.ask ? money(card.ask) : "NOT PRICED YET"}</strong>
    </div>

    <div class="marketTitle">MARKET REFERENCES</div>

    <div class="market">
      <div>
        <span>COLLECTR</span>
        <strong>${money(card.collectr)}</strong>
      </div>

      <div>
        <span>PRICECHARTING</span>
        <strong>${money(card.pcReference)}</strong>
      </div>

      <div>
        <span>TCGPLAYER</span>
        <strong>${card.tcgRef ? "LINKED" : "—"}</strong>
      </div>
    </div>
  `;

  el.style.display="block";
  el.scrollIntoView({behavior:"smooth",block:"start"});
}


function lookupCard(){
  const id=normalizeId(
    document.getElementById("dittoId").value
  );

  if(!id){
    alert("Enter a valid Ditto ID.");
    return;
  }

  const raw=localStorage.getItem("dittoInventory");

  if(!raw){
    alert("No offline inventory has been synced yet.");
    return;
  }

  try{
    const cards=JSON.parse(raw);

    if(!cards[id]){
      alert(id+" is not stored on this device.");
      return;
    }

    showCard(cards[id]);

  }catch(err){
    alert("Offline inventory could not be read.");
  }
}


function syncInventory(){
  if(!navigator.onLine){
    alert("Reconnect to the internet before syncing.");
    return;
  }

  const button=document.getElementById("syncButton");

  button.disabled=true;
  button.textContent="SYNCING...";

  window.dittoReceiveInventory=function(payload){
    try{
      if(!payload || !payload.ok || !payload.cards){
        throw new Error(
          payload && payload.error
            ? payload.error
            : "Invalid inventory response."
        );
      }

      localStorage.setItem(
        "dittoInventory",
        JSON.stringify(payload.cards)
      );

      localStorage.setItem(
        "dittoLastSync",
        payload.syncedAt || new Date().toISOString()
      );

      updateInventory();

      alert(payload.count+" cards synced to this device.");

    }catch(err){
      alert("Ditto sync failed: "+err.message);

    }finally{
      button.disabled=false;
      button.textContent="↻ SYNC INVENTORY";

      const old=document.getElementById("syncLoader");
      if(old) old.remove();
    }
  };

  const script=document.createElement("script");
  script.id="syncLoader";

  script.onerror=function(){
    button.disabled=false;
    button.textContent="↻ SYNC INVENTORY";

    const old=document.getElementById("syncLoader");
    if(old) old.remove();

    alert("Could not reach Ditto Offline Sync.");
  };

  script.src=
    SYNC_URL+
    "?callback=dittoReceiveInventory&t="+
    Date.now();

  document.body.appendChild(script);
}


function scanCard(){
  alert("QR scanner comes next. First we prove offline lookup.");
}


document
  .getElementById("dittoId")
  .addEventListener("keydown",function(e){
    if(e.key==="Enter") lookupCard();
  });


window.addEventListener("online",updateConnection);
window.addEventListener("offline",updateConnection);

updateConnection();
updateInventory();
</script>

</body>
</html>
