<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan the Ditto</title>
</head>

<body>
  <p>Ditto is opening your card...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const appUrl =
      "https://script.google.com/macros/s/AKfycbz0PH87cfp7_6jPS4NWdSiIOaslOqfFd5X5MBDwQe3xGec58ID5yVTTV9P6TPsuu7jS/exec";

    if (id) {
      window.location.replace(
        appUrl + "?id=" + encodeURIComponent(id)
      );
    } else {
      document.body.innerHTML =
        "<h2>No Ditto ID found.</h2>";
    }
  </script>
</body>
</html>
